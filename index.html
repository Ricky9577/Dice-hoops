<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <meta name="theme-color" content="#ff7a1a" />
  <title>Dice Hoops</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app" class="app">
    <section id="home" class="screen active">
      <div class="home-top">
        <div class="brand">
          <div class="logo-mark">DH</div>
          <div>
            <div class="title" data-i18n="app_title">Dice Hoops</div>
            <div class="subtitle" data-i18n="app_tagline">Basket turn-based con dadi</div>
          </div>
        </div>
        <div class="lang-row">
          <label for="langSelect" data-i18n="language">Lingua</label>
          <select id="langSelect">
            <option value="it">IT</option>
            <option value="en">EN</option>
            <option value="es">ES</option>
          </select>
        </div>
      </div>

      <div class="home-actions">
        <button id="playBtn" class="primary big" data-i18n="play">Gioca</button>
        <button id="statsBtn" class="ghost big" data-i18n="stats">Statistiche</button>
        <button id="tutorialBtn" class="ghost big" data-i18n="tutorial">Tutorial</button>
        <button id="coachBtn" class="outline big" data-i18n="tutorial_interactive">Tutorial interattivo</button>
      </div>

      <div class="home-footer">
        <div class="badge">PWA</div>
        <div class="small" data-i18n="offline_ready">Gioco offline</div>
      </div>
    </section>

    <section id="game" class="screen">
      <header class="topbar">
        <button class="icon-btn" id="homeBtn" aria-label="Home">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 10.5L12 3l9 7.5v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z" />
          </svg>
        </button>
        <div class="topbar-title">Dice Hoops</div>
        <div class="scoreboard" id="scoreboard">YOU 0 • AI 0</div>
        <button class="icon-btn" id="soundBtn" aria-label="Sound">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 9v6h4l5 4V5L8 9H4z" />
            <path class="sound-wave" d="M16 8c1.5 1.3 1.5 6.7 0 8" />
            <path class="sound-wave" d="M18.5 5.5c2.5 2.2 2.5 10.8 0 13" />
          </svg>
        </button>
      </header>

      <div class="game-body">
        <section class="court">
          <div class="court-bg"></div>
          <div class="pole"></div>
          <div class="backboard"></div>
          <div class="rim" id="rim"></div>
          <div class="net"></div>
          <div class="paint"></div>
          <div class="ball-layer" id="ballLayer">
            <div class="shooter" id="shooter">
              <div class="shooter-shadow"></div>
              <div class="shooter-outline"></div>
              <div class="shooter-head"></div>
              <div class="shooter-torso">
                <div class="jersey-number">23</div>
              </div>
              <div class="shooter-hip"></div>
              <div class="shooter-shorts"></div>
              <div class="shooter-leg leg-back"></div>
              <div class="shooter-leg leg-front"></div>
              <div class="shooter-shoe shoe-back"></div>
              <div class="shooter-shoe shoe-front"></div>
              <div class="shooter-arm arm-back">
                <div class="arm-upper"></div>
                <div class="arm-lower"></div>
              </div>
              <div class="shooter-arm arm-front">
                <div class="arm-upper"></div>
                <div class="arm-lower"></div>
              </div>
              <div class="shooter-ball"></div>
            </div>
            <div class="ball" id="ball"></div>
          </div>
        </section>

        <section class="dice-row">
          <div class="dice-card">
            <div class="dice-label" data-i18n="dice_player">Giocatore</div>
            <div class="dice3d d1" id="dice1" data-value="1">
              <div class="cube">
                <div class="face front">
                  <span class="pip c"></span>
                </div>
                <div class="face back">
                  <span class="pip tl"></span>
                  <span class="pip tr"></span>
                  <span class="pip ml"></span>
                  <span class="pip mr"></span>
                  <span class="pip bl"></span>
                  <span class="pip br"></span>
                </div>
                <div class="face right">
                  <span class="pip tl"></span>
                  <span class="pip c"></span>
                  <span class="pip br"></span>
                </div>
                <div class="face left">
                  <span class="pip tl"></span>
                  <span class="pip tr"></span>
                  <span class="pip bl"></span>
                  <span class="pip br"></span>
                </div>
                <div class="face top">
                  <span class="pip tl"></span>
                  <span class="pip tr"></span>
                  <span class="pip c"></span>
                  <span class="pip bl"></span>
                  <span class="pip br"></span>
                </div>
                <div class="face bottom">
                  <span class="pip tl"></span>
                  <span class="pip br"></span>
                </div>
              </div>
            </div>
          </div>

          <div class="dice-card">
            <div class="dice-label" data-i18n="dice_context">Contesto</div>
            <div class="dice3d d2" id="dice2" data-value="1">
              <div class="cube">
                <div class="face front">
                  <span class="pip c"></span>
                </div>
                <div class="face back">
                  <span class="pip tl"></span>
                  <span class="pip tr"></span>
                  <span class="pip ml"></span>
                  <span class="pip mr"></span>
                  <span class="pip bl"></span>
                  <span class="pip br"></span>
                </div>
                <div class="face right">
                  <span class="pip tl"></span>
                  <span class="pip c"></span>
                  <span class="pip br"></span>
                </div>
                <div class="face left">
                  <span class="pip tl"></span>
                  <span class="pip tr"></span>
                  <span class="pip bl"></span>
                  <span class="pip br"></span>
                </div>
                <div class="face top">
                  <span class="pip tl"></span>
                  <span class="pip tr"></span>
                  <span class="pip c"></span>
                  <span class="pip bl"></span>
                  <span class="pip br"></span>
                </div>
                <div class="face bottom">
                  <span class="pip tl"></span>
                  <span class="pip br"></span>
                </div>
              </div>
            </div>
          </div>

          <div class="dice-card">
            <div class="dice-label" data-i18n="dice_result">Esito</div>
            <div class="dice3d d3" id="dice3" data-value="1">
              <div class="cube">
                <div class="face front">
                  <span class="pip c"></span>
                </div>
                <div class="face back">
                  <span class="pip tl"></span>
                  <span class="pip tr"></span>
                  <span class="pip ml"></span>
                  <span class="pip mr"></span>
                  <span class="pip bl"></span>
                  <span class="pip br"></span>
                </div>
                <div class="face right">
                  <span class="pip tl"></span>
                  <span class="pip c"></span>
                  <span class="pip br"></span>
                </div>
                <div class="face left">
                  <span class="pip tl"></span>
                  <span class="pip tr"></span>
                  <span class="pip bl"></span>
                  <span class="pip br"></span>
                </div>
                <div class="face top">
                  <span class="pip tl"></span>
                  <span class="pip tr"></span>
                  <span class="pip c"></span>
                  <span class="pip bl"></span>
                  <span class="pip br"></span>
                </div>
                <div class="face bottom">
                  <span class="pip tl"></span>
                  <span class="pip br"></span>
                </div>
              </div>
            </div>
          </div>
        </section>

        <section class="control-panel">
          <div class="meta-row">
            <div class="possession" id="possessionLabel" data-i18n="possession">Possesso: YOU</div>
            <div class="active-player" id="activePlayerLabel">Giocatore attivo: -</div>
          </div>
          <div id="playerChooser" class="player-chooser hidden">
            <button data-player="0">PG</button>
            <button data-player="1">SG</button>
            <button data-player="2">SF</button>
            <button data-player="3">PF</button>
            <button data-player="4">C</button>
          </div>
          <div class="shot-area">
            <div class="section-title" data-i18n="choose_shot">Scegli il tiro</div>
            <div class="shot-buttons">
              <button class="shot-btn" data-shot="layup" data-i18n="shot_layup">Layup</button>
              <button class="shot-btn" data-shot="mid" data-i18n="shot_mid">Midrange</button>
              <button class="shot-btn" data-shot="three" data-i18n="shot_three">3PT</button>
            </div>
          </div>
          <button id="rollBtn" class="primary roll" data-i18n="roll">Lancia</button>
          <details class="lineups">
            <summary data-i18n="lineups">Lineups</summary>
            <div id="lineupsContent" class="lineups-content"></div>
          </details>
        </section>

        <section class="log-panel">
          <div class="section-title" data-i18n="log">Cronaca</div>
          <div id="logList" class="log-list"></div>
        </section>

        <button id="newGameBtn" class="ghost wide" data-i18n="new_game">Nuova partita</button>
      </div>
    </section>

    <section id="stats" class="screen">
      <header class="topbar">
        <button class="icon-btn" id="homeBtnStats" aria-label="Home">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 10.5L12 3l9 7.5v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z" />
          </svg>
        </button>
        <div class="topbar-title" data-i18n="stats">Statistiche</div>
        <div class="spacer"></div>
        <div class="mini-pill" id="statsSummary">0-0</div>
      </header>
      <div class="screen-content" id="statsContent"></div>
    </section>

    <section id="tutorial" class="screen">
      <header class="topbar">
        <button class="icon-btn" id="homeBtnTutorial" aria-label="Home">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 10.5L12 3l9 7.5v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z" />
          </svg>
        </button>
        <div class="topbar-title" data-i18n="tutorial">Tutorial</div>
        <div class="spacer"></div>
      </header>
      <div class="screen-content">
        <div id="tutorialText" class="tutorial-text"></div>
      </div>
    </section>
  </div>

  <div id="coachOverlay" class="coach hidden">
    <div class="coach-dim"></div>
    <div class="coach-focus" id="coachFocus"></div>
    <div class="coach-card">
      <div id="coachText" class="coach-text"></div>
      <div class="coach-actions">
        <button id="coachPrev" class="ghost small-btn" data-i18n="back">Indietro</button>
        <button id="coachNext" class="primary small-btn" data-i18n="next">Avanti</button>
        <button id="coachSkip" class="outline small-btn" data-i18n="skip">Salta</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
